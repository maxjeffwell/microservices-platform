name: Build and Deploy Vertex Platform

on:
  push:
    branches: [ "main" ]
    paths:
      - 'services/platform/**'
      - 'k8s/services/**'
      - '.github/workflows/build-and-deploy-vertex.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: maxjeffwell/vertex-platform
  GHCR_IMAGE_PREFIX: ghcr.io/maxjeffwell/vertex-platform

jobs:
  prepare:
    name: Prepare Build
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Extract metadata
        id: meta
        run: |
          TAG="$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building with tag: ${TAG}"

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: prepare

    strategy:
      matrix:
        service:
          - name: auth-service
            context: .
            dockerfile: ./services/platform/auth-service/Dockerfile
          - name: analytics-service
            context: .
            dockerfile: ./services/platform/analytics-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Get DockerHub credentials from Doppler
        id: dockerhub
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          echo "username=$(doppler secrets get DOCKERHUB_USERNAME --plain)" >> $GITHUB_OUTPUT
          echo "password=$(doppler secrets get DOCKERHUB_PASSWORD --plain)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ steps.dockerhub.outputs.password }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ needs.prepare.outputs.image-tag }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
            ${{ env.GHCR_IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ needs.prepare.outputs.image-tag }}
            ${{ env.GHCR_IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifests:
    name: Update K8s Manifests
    runs-on: ubuntu-latest
    needs: [prepare, build-and-push]
    concurrency:
      group: gitops-update-vertex
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update manifests and push
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Updating Vertex Platform image tags to: ${IMAGE_TAG}"

          MAX_RETRIES=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            git fetch origin main
            git reset --hard origin/main

            # Update Auth Service deployment
            sed -i "s|image: docker.io/maxjeffwell/vertex-platform-auth-service:.*|image: docker.io/maxjeffwell/vertex-platform-auth-service:${IMAGE_TAG}|" k8s/services/auth-service.yaml

            # Update Analytics Service deployment
            sed -i "s|image: docker.io/maxjeffwell/vertex-platform-analytics-service:.*|image: docker.io/maxjeffwell/vertex-platform-analytics-service:${IMAGE_TAG}|" k8s/services/analytics-service.yaml

            git diff k8s/services/

            if git diff --quiet k8s/services/; then
              echo "No changes needed - tags already set to ${IMAGE_TAG}"
              exit 0
            fi

            git add k8s/services/auth-service.yaml k8s/services/analytics-service.yaml
            git commit -m "Update Vertex Platform image tags to ${IMAGE_TAG}"

            if git push origin main; then
              echo "Manifests updated. ArgoCD will automatically deploy."
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Push failed (attempt $RETRY_COUNT/$MAX_RETRIES), retrying..."
            sleep $((RETRY_COUNT * 2))
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1
