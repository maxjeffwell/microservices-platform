# Bitnami MongoDB for the microservices platform -- Helm release `mongodb`, ns microservices
# Chart oci://registry-1.docker.io/bitnamicharts/mongodb 18.1.10. NOT ArgoCD-managed.
# Captured into git 2026-09-27 from the release's user values (originally set with --set).
# 🔑 auth.password / auth.rootPassword are deliberately NOT here (public repo). They
#    live in the release's Secret `mongodb`; pass them back at upgrade time:
#   helm upgrade mongodb oci://registry-1.docker.io/bitnamicharts/mongodb --version 18.1.10 \
#     -n microservices -f k8s/infrastructure/mongodb-values.yaml \
#     --set auth.rootPassword="$(kubectl get secret -n microservices mongodb -o jsonpath='{.data.mongodb-root-password}' | base64 -d)" \
#     --set auth.password="$(kubectl get secret -n microservices mongodb -o jsonpath='{.data.mongodb-passwords}' | base64 -d)"
#   (without them the chart would generate NEW random passwords and break every client)
# affinity (2026-09-30): NO node preference — scheduler-placed by free requests.
# (History: soft m920s 9/27 -> soft neonmarmoset 9/30 -> none.) Data is a
# mayastor-2 RF2 volume attachable from any csi-node. podAntiAffinity is the
# chart default, kept.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: mongodb
            app.kubernetes.io/instance: mongodb
            app.kubernetes.io/name: mongodb
        topologyKey: kubernetes.io/hostname
      weight: 1
auth:
  database: platform
  username: platform
image:
  digest: sha256:894f28542d7747b163f78c5249b248bd6b5fb26d44261ead39566148de2d839a
  tag: 8.2.6-debian-12-r0
livenessProbe:
  periodSeconds: 60
persistence:
  storageClass: mayastor-2
readinessProbe:
  periodSeconds: 30
resources:
  limits:
    cpu: 2
    ephemeral-storage: 2Gi
    memory: 768Mi
  requests:
    cpu: 500m
    ephemeral-storage: 50Mi
    memory: 512Mi
updateStrategy:
  type: Recreate
