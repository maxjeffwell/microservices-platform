# Strimzi Kafka Cluster for Vertex Platform (KRaft mode - no ZooKeeper)
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: vertex-kafka-pool
  namespace: microservices
  labels:
    strimzi.io/cluster: vertex-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  template:
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: In
                    values:
                      - data
  # 2026-09-27: local-path (default SC) -> openebs-lvmpv on m720q (data copied,
  # PVC rebound). lvm-localpv gives capacity enforcement + CSI snapshots.
  storage:
    type: persistent-claim
    size: 5Gi
    class: openebs-lvmpv
    deleteClaim: false
  # 2026-09-22: memory request 512Mi (git) / 768Mi (live, patched out of band)
  # -> 896Mi. Strimzi sets -Xms=-Xmx to 50% of the LIMIT (495Mi here), fully
  # committed at start, plus ~260Mi non-heap for 120 threads, metaspace and
  # code cache, so the broker's working set is ~756Mi by construction (flat,
  # 30-day peak 805Mi, heap only ~53% used). The limit stays 1Gi on purpose:
  # raising it raises the heap too. cpu 100m records the live value (15m used).
  resources:
    requests:
      memory: 896Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 1000m
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: vertex-kafka
  namespace: microservices
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.1
    metadataVersion: "4.1"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: true
      log.retention.hours: 168
  entityOperator:
    template:
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: role
                      operator: In
                      values:
                        - data
    topicOperator:
      startupProbe:
        initialDelaySeconds: 15
        periodSeconds: 10
        failureThreshold: 60
        timeoutSeconds: 5
      livenessProbe:
        initialDelaySeconds: 0
        periodSeconds: 10
        failureThreshold: 3
        timeoutSeconds: 5
      resources:
        requests:
          cpu: 50m
          memory: 384Mi
        limits:
          memory: 384Mi
    userOperator:
      livenessProbe:
        initialDelaySeconds: 120
        periodSeconds: 10
        failureThreshold: 3
        timeoutSeconds: 5
      readinessProbe:
        initialDelaySeconds: 60
        periodSeconds: 10
        failureThreshold: 3
        timeoutSeconds: 5
      resources:
        requests:
          cpu: 50m
          memory: 384Mi
        limits:
          memory: 384Mi
---
# Create the analytics events topic
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: analytics.events
  namespace: microservices
  labels:
    strimzi.io/cluster: vertex-kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000
