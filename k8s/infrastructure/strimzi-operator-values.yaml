# Strimzi Kafka Operator Helm values
# Chart: strimzi/strimzi-kafka-operator 0.50.1
# Release: kafka (namespace: microservices)
#
# Install/upgrade (post-renderer patches probe timeouts not exposed by chart):
#   helm upgrade --install kafka strimzi/strimzi-kafka-operator \
#     -n microservices -f strimzi-operator-values.yaml \
#     --post-renderer ./strimzi-post-render/kustomize

# Pin operator to data node to reduce load on control-plane VPS
nodeSelector:
  role: data

# Increase CPU limit — default 1000m causes CFS throttling during
# reconciliation bursts, which delays lease renewal and triggers
# leader election loss (CrashLoopBackOff).
resources:
  limits:
    cpu: 2000m
    memory: 384Mi
  requests:
    cpu: 200m
    memory: 384Mi
