apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: vertex-platform
  labels:
    app: auth-service
spec:
  # 2026-10-15: 2 replicas, rolling, spread across servers (+ PDB) so a server
  # loss or a deploy never takes the service down. Stateless.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      annotations:
        el-jefe.me/database: "patroni-2026-10-23"   # auth DB moved to the Patroni HA cluster; bump to roll pods
      labels:
        app: auth-service
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: auth-service
      containers:
        - name: auth-service
          image: docker.io/maxjeffwell/vertex-platform-auth-service:20261023-100332-fe2fad7
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: NODE_ENV
            - name: PORT
              value: "3001"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: AUTH_DATABASE_URL
            - name: NODE_EXTRA_CA_CERTS   # Patroni cluster CA -> DATABASE_URL uses sslmode=verify-full
              value: /etc/pg-ha/ca.crt
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
            # Cross-replica rate-limit counters (shared/middleware/rateLimitStore.js).
            # Unset REDIS_URL = per-pod in-memory counters (2 replicas = 2x budget).
            - name: REDIS_URL
              value: redis://redis.default.svc.cluster.local:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: REDIS_PASSWORD
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: JWT_EXPIRES_IN
            - name: JWT_REFRESH_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: JWT_REFRESH_EXPIRES_IN
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: CORS_ORIGIN
          volumeMounts:
            - name: pg-ha-ca
              mountPath: /etc/pg-ha
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: pg-ha-ca
          secret:
            secretName: pg-ha-ca
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: vertex-platform
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service
  namespace: vertex-platform
  labels:
    app: auth-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-service
