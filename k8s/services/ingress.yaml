---
# Public entry for the Vertex platform. Services mount their own prefixes
# (auth-service: /auth, /, /health; analytics-service: /analytics) — no
# prefix stripping. Replaces the relic rule in portfolio-orchestration-ingress
# (default ns) that pointed at selector-less stub services.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vertex-platform
  namespace: vertex-platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - vertex-platform.el-jefe.me
      secretName: vertex-platform-tls
  rules:
    - host: vertex-platform.el-jefe.me
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3001
          - path: /analytics
            pathType: Prefix
            backend:
              service:
                name: analytics-service
                port:
                  number: 3005
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3001
