apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: vertex-platform
  annotations:
    # Applied before the Deployments that read it.
    argocd.argoproj.io/sync-wave: "-1"
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"

  # JWT
  JWT_EXPIRES_IN: "7d"
  JWT_REFRESH_EXPIRES_IN: "30d"

  # Redis

  # InfluxDB
  INFLUXDB_URL: "http://influxdb.monitoring.svc.cluster.local:8086"
  INFLUXDB_ORG: "homenet"
  INFLUXDB_BUCKET: "vertex-analytics"

  # Kafka
  KAFKA_BROKERS: "vertex-kafka-kafka-bootstrap.microservices.svc.cluster.local:9092"
  KAFKA_CLIENT_ID: "analytics-service"
  KAFKA_GROUP_ID: "analytics-service-group"
  KAFKA_EVENTS_TOPIC: "analytics.events"
  # k8s-allocation-producer -> Kafka -> analytics-service -> InfluxDB k8s-allocation
  KAFKA_ALLOCATION_TOPICS: "k8s.allocation,k8s.allocation.events"
  KAFKA_ALLOCATION_TOPIC: "k8s.allocation"
  KAFKA_ALLOCATION_EVENTS_TOPIC: "k8s.allocation.events"
  ALLOCATION_INFLUXDB_BUCKET: "k8s-allocation"
  # Real-user web vitals: POST /analytics/rum -> Kafka web.vitals -> InfluxDB web-perf
  KAFKA_WEBPERF_TOPIC: "web.vitals"
  WEBPERF_INFLUXDB_BUCKET: "web-perf"
  RUM_APPS: "code-talk,educationelly,educationelly-graphql,bookmarked,firebook,intervalai"

  # CORS
  CORS_ORIGIN: "*"

  # Rate Limiting
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
